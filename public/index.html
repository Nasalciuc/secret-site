        <!--
            Defer non-critical CSS chunks (calendar, animxyz). Webpack injects
            them as render-blocking <link rel="stylesheet">; we swap them to
            non-blocking by setting media="print" until load. Runs before the
            browser's preload scanner kicks in by being placed early in <head>.
        -->
        <script>
            ;(function () {
                var deferPatterns = [/vendor-calendar/, /vendor-animxyz/]
                function defer(link) {
                    if (link.dataset.deferred) return
                    link.dataset.deferred = '1'
                    var orig = link.media || 'all'
                    link.media = 'print'
                    link.onload = function () {
                        link.onload = null
                        link.media = orig
                    }
                }
                function scan() {
                    var links = document.querySelectorAll('link[rel="stylesheet"]')
                    for (var i = 0; i < links.length; i++) {
                        var href = links[i].href || ''
                        for (var j = 0; j < deferPatterns.length; j++) {
                            if (deferPatterns[j].test(href)) {
                                defer(links[i])
                                break
                            }
                        }
                    }
                }
                // Run repeatedly during head parse so we catch links as webpack injects them.
                scan()
                var mo = new MutationObserver(scan)
                mo.observe(document.documentElement, { childList: true, subtree: true })
                document.addEventListener('DOMContentLoaded', function () {
                    mo.disconnect()
                    scan()
                })
            })()
        </script>

        <!--
            Third-party scripts (GTM, Hotjar, Tawk.to, Facebook Pixel, reCAPTCHA)
            are loaded after window.load + a small idle delay to keep them off the
            critical path. This drastically improves TBT and LCP on PageSpeed.
        -->
        <script>
            ;(function () {
                var GTM_ID = '<%= typeof VUE_APP_GTM_ID !== "undefined" ? VUE_APP_GTM_ID : "" %>'
                var FB_PIXEL_ID =
                    '<%= typeof VUE_APP_FACEBOOK_PIXEL_ID !== "undefined" ? VUE_APP_FACEBOOK_PIXEL_ID : "" %>'
                var RECAPTCHA_KEY =
                    '<%= typeof VUE_APP_RECAPTCHA_SITE_KEY !== "undefined" ? VUE_APP_RECAPTCHA_SITE_KEY : "" %>'

                function loadScript(src, opts) {
                    opts = opts || {}
                    var s = document.createElement('script')
                    s.src = src
                    s.async = true
                    if (opts.crossorigin) s.setAttribute('crossorigin', opts.crossorigin)
                    if (opts.charset) s.charset = opts.charset
                    document.head.appendChild(s)
                    return s
                }

                function loadThirdParty() {
                    // Google Tag Manager
                    if (GTM_ID) {
                        window.dataLayer = window.dataLayer || []
                        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
                        loadScript('https://www.googletagmanager.com/gtm.js?id=' + GTM_ID)
                    }

                    // Hotjar
                    ;(function (h, o, t, j) {
                        h.hj =
                            h.hj ||
                            function () {
                                ;(h.hj.q = h.hj.q || []).push(arguments)
                            }
                        h._hjSettings = { hjid: 5087460, hjsv: 6 }
                        var r = o.createElement('script')
                        r.async = 1
                        r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv
                        o.head.appendChild(r)
                    })(window, document, 'https://static.hotjar.com/c/hotjar-', '.js?sv=')

                    // Facebook Pixel
                    if (FB_PIXEL_ID) {
                        ;(function (f, b, e, v, n, t, s) {
                            if (f.fbq) return
                            n = f.fbq = function () {
                                n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
                            }
                            if (!f._fbq) f._fbq = n
                            n.push = n
                            n.loaded = !0
                            n.version = '2.0'
                            n.queue = []
                            t = b.createElement(e)
                            t.async = !0
                            t.src = v
                            s = b.getElementsByTagName(e)[0]
                            s.parentNode.insertBefore(t, s)
                        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js')
                        fbq('init', FB_PIXEL_ID)
                        fbq('track', 'PageView')
                    }
                }

                // Tawk.to is heavy (~300 KB). Load only after first interaction or 5s idle.
                // function loadTawk() {
                //     if (window.__tawkLoaded) return
                //     window.__tawkLoaded = true
                //     window.Tawk_API = window.Tawk_API || {}
                //     window.Tawk_LoadStart = new Date()
                //     var s = document.createElement('script')
                //     s.async = true
                //     s.src = 'https://embed.tawk.to/67ffc3bcd825181910e0cc1c/1iovh962s'
                //     s.charset = 'UTF-8'
                //     s.setAttribute('crossorigin', '*')
                //     document.head.appendChild(s)
                // }

                // reCAPTCHA — lazy-load on first form interaction or after idle.
                function loadRecaptcha() {
                    if (!RECAPTCHA_KEY || window.__recaptchaLoaded) return
                    window.__recaptchaLoaded = true
                    loadScript('https://www.google.com/recaptcha/api.js?render=' + RECAPTCHA_KEY)
                }

                function onIdle(cb, timeout) {
                    if ('requestIdleCallback' in window) {
                        window.requestIdleCallback(cb, { timeout: timeout || 4000 })
                    } else {
                        setTimeout(cb, timeout || 2000)
                    }
                }

                function start() {
                    onIdle(loadThirdParty, 2000)

                    // Defer Tawk and reCAPTCHA until interaction or longer idle
                    var interactionEvents = ['scroll', 'mousemove', 'touchstart', 'keydown', 'click']
                    var triggered = false
                    function onInteract() {
                        if (triggered) return
                        triggered = true
                        interactionEvents.forEach(function (e) {
                            window.removeEventListener(e, onInteract, { passive: true })
                        })
                        // loadTawk()
                        loadRecaptcha()
                    }
                    interactionEvents.forEach(function (e) {
                        window.addEventListener(e, onInteract, { passive: true })
                    })
                    // Fallback: load after 6s even without interaction
                    setTimeout(onInteract, 6000)
                }

                if (document.readyState === 'complete') {
                    start()
                } else {
                    window.addEventListener('load', start)
                }
            })()
        </script>

        <script>
            ;(function () {
                // CRM source slugs (must match values in admin panel exactly)
                var UTM_MAP = {
                    bing: 'bing',
                    google: 'google',
                    facebook: 'facebook',
                    fb: 'facebook',
                    fb_bct: 'fb_bct',
                    instagram: 'instagram',
                    ig: 'instagram',
                    kayak: 'kayak',
                    cheapflights: 'cheapflights',
                    skyscanner: 'skyscanner',
                    trustpilot: 'trustpilot',
                    mailchimp: 'mailchimp',
                    ota: 'ota',
                }
                var REF_MAP = {
                    'bing.com': 'bing',
                    'google.': 'google',
                    'facebook.com': 'facebook',
                    'fb.com': 'facebook',
                    'instagram.com': 'instagram',
                    'kayak.': 'kayak',
                    'cheapflights.': 'cheapflights',
                    'skyscanner.': 'skyscanner',
                    'trustpilot.': 'trustpilot',
                    'mailchimp.': 'mailchimp',
                }
                function getSource() {
                    try {
                        var p = new URLSearchParams(location.search)
                        var utm = (p.get('utm_source') || '').toLowerCase().trim()
                        if (utm) return UTM_MAP[utm] || 'other'
                        var ref = document.referrer
                        if (!ref) return 'whatsapp'
                        var host = new URL(ref).hostname.replace(/^www\./, '').toLowerCase()
                        if (host.indexOf(location.hostname.replace(/^www\./, '')) > -1) return 'whatsapp'
                        for (var k in REF_MAP) if (host.indexOf(k) > -1) return REF_MAP[k]
                        return 'other'
                    } catch (e) {
                        return 'whatsapp'
                    }
                }
                function getCampaign() {
                    try {
                        var p = new URLSearchParams(location.search)
                        var c = (p.get('utm_campaign') || '').toLowerCase().trim()
                        if (!c) return 'none'
                        c = c.replace(/[^a-z0-9]/g, '').slice(0, 12)
                        return c || 'none'
                    } catch (e) {
                        return 'none'
                    }
                }
                function getPage() {
                    var seg = location.pathname.split('/').filter(Boolean)[0]
                    if (!seg) return 'HOM'
                    var parts = seg.split('-')
                    return (parts[parts.length - 1] || 'HOM')
                        .replace(/[^a-z0-9]/gi, '')
                        .slice(0, 3)
                        .toUpperCase()
                }
                function getDate() {
                    var d = new Date()
                    return ('0' + d.getDate()).slice(-2) + ('0' + (d.getMonth() + 1)).slice(-2)
                }
                var ref = 'BBC-' + getSource() + '-' + getCampaign() + '-' + getPage() + '-' + getDate()
                var msg = "Hi! I'd like a quote — ref " + ref
                var btn = document.getElementById('wa-btn')
                if (btn) btn.href = 'https://wa.me/12243469633?text=' + encodeURIComponent(msg)

                // Show the WhatsApp widget only between 3:00pm and 5:00am Chisinau time
                // (every day); hidden otherwise (between 5:00am and 3:00pm).
                function chisinauHour() {
                    try {
                        var s = new Intl.DateTimeFormat('en-US', {
                            timeZone: 'Europe/Chisinau',
                            hour: 'numeric',
                            hour12: false,
                        }).format(new Date())
                        var h = parseInt(s, 10)
                        return h === 24 ? 0 : h
                    } catch (e) {
                        return new Date().getHours()
                    }
                }
                function withinSchedule() {
                    var h = chisinauHour()
                    return h >= 15 || h < 5
                }
                function updateVisibility() {
                    if (!btn) return
                    btn.style.display = withinSchedule() ? 'flex' : 'none'
                }
                updateVisibility()
                // Re-check every minute so it appears/disappears without a page reload.
                setInterval(updateVisibility, 60000)
            })()
        </script>
